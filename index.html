<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Info Display</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="carousel" aria-hidden="true">
    <!-- Slide <img> elements are injected here by script.js -->
  </div>

  <div id="progress"><div id="progress-bar"></div></div>

  <div id="dots"></div>

  <div id="empty-state">
    <p>No images found.</p>
    <p class="hint">Add image files to the <code>images/</code> folder and list them in <code>images/manifest.json</code>, then reload.</p>
  </div>

<script src="script.js"></script>
</body>
</html>
